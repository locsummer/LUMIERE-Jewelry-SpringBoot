<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/client :: head('Thanh toán')}"></head><body><header th:replace="~{fragments/client :: header('')}"></header>
<main class="container layout_padding"><div class="page-heading"><div><h1>Thanh toán</h1><p>Nhập thông tin nhận sản phẩm và chọn cách thanh toán</p></div></div><form th:action="@{/checkout}" th:object="${checkoutForm}" method="post"><div class="row"><div class="col-lg-7"><div class="checkout-card"><h3><span>1</span> Thông tin giao hàng</h3><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><div class="row"><div class="col-md-6 form-group"><label>Người nhận *</label><input class="form-control" th:field="*{customerName}"><small class="text-danger" th:errors="*{customerName}"></small></div><div class="col-md-6 form-group"><label>Số điện thoại *</label><input class="form-control" th:field="*{customerPhone}"><small class="text-danger" th:errors="*{customerPhone}"></small></div></div><div class="form-group"><label>Email nhận hóa đơn *</label><input class="form-control" type="email" th:field="*{customerEmail}"><small class="text-danger" th:errors="*{customerEmail}"></small></div><div class="form-group"><label>Địa chỉ giao hàng *</label><textarea class="form-control" rows="3" th:field="*{deliveryAddress}"></textarea><small class="text-danger" th:errors="*{deliveryAddress}"></small></div><div class="form-group"><label>Ghi chú</label><textarea class="form-control" rows="2" th:field="*{note}" placeholder="Ít cay, không hành..."></textarea></div></div>
        <div class="checkout-card"><h3><span>2</span> Phương thức thanh toán</h3><label th:each="method : ${paymentMethods}" class="payment-option"><input type="radio" th:field="*{paymentMethod}" th:value="${method}"><div><strong th:text="${method.label}"></strong><small th:if="${method.name() == 'COD'}">Trả tiền mặt cho nhân viên giao hàng</small><small th:if="${method.name() == 'BANK_TRANSFER'}">Quét mã QR MB Bank — STK 663883333</small><small th:if="${method.name() == 'VNPAY'}">Mô phỏng cổng thanh toán, không cần khóa bí mật</small></div></label><small class="text-danger" th:errors="*{paymentMethod}"></small></div></div>
    <div class="col-lg-5"><div class="summary-card sticky-summary"><h3>Đơn hàng</h3><div th:each="item : ${items}" class="checkout-item"><img th:src="${item.product.image}"><div><strong th:text="${item.product.name}"></strong><small th:text="'Số lượng: ' + ${item.quantity}"></small></div><span th:text="${#numbers.formatDecimal(item.subtotal,0,'COMMA',0,'POINT')} + ' ₫'"></span></div><hr><div><span>Tạm tính</span><strong th:text="${#numbers.formatDecimal(subtotal,0,'COMMA',0,'POINT')} + ' ₫'"></strong></div><div><span>Phí giao hàng</span><strong th:text="${shipping.signum() == 0 ? 'Miễn phí' : #numbers.formatDecimal(shipping,0,'COMMA',0,'POINT') + ' ₫'}"></strong></div><hr><div class="total"><span>Tổng thanh toán</span><strong th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + ' ₫'"></strong></div><button class="btn btn-warning btn-block btn-lg" type="submit">Xác nhận đặt sản phẩm</button><small><i class="fa fa-lock"></i> Thông tin của bạn được bảo vệ</small></div></div></div></form>
</main><footer th:replace="~{fragments/client :: footer}"></footer><th:block th:replace="~{fragments/client :: scripts}"></th:block></body></html>
