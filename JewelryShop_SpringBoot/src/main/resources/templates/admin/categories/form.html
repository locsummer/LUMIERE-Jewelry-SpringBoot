<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/admin :: head(${editId == null ? 'Thêm danh mục' : 'Sửa danh mục'})}"></head><body><aside th:replace="~{fragments/admin :: sidebar('categories')}"></aside><main class="admin-main"><header th:replace="~{fragments/admin :: topbar(${editId == null ? 'Thêm danh mục' : 'Cập nhật danh mục'})}"></header><div class="admin-content"><form th:action="${editId == null ? '/admin/categories/create' : '/admin/categories/edit/' + editId}" th:object="${categoryForm}" method="post" class="admin-panel form-panel small-form"><div class="panel-head"><div><h2>Thông tin danh mục</h2><p>Đường dẫn thân thiện sẽ được tạo tự động</p></div><a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Quay lại</a></div><div class="form-group"><label>Tên danh mục *</label><input class="form-control" th:field="*{name}"><small class="text-danger" th:errors="*{name}"></small></div><div class="form-group"><label>Mô tả</label><textarea class="form-control" rows="4" th:field="*{description}"></textarea></div><div class="custom-control custom-switch mb-4"><input class="custom-control-input" type="checkbox" th:field="*{active}" id="active"><label class="custom-control-label" for="active">Hiển thị danh mục</label></div><button class="btn btn-warning btn-lg" type="submit"><i class="fa fa-save"></i> Lưu danh mục</button></form></div></main><th:block th:replace="~{fragments/admin :: scripts}"></th:block></body></html>
