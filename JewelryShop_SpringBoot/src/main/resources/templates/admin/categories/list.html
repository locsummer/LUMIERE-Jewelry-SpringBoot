<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/admin :: head('Quản lý danh mục')}"></head><body><aside th:replace="~{fragments/admin :: sidebar('categories')}"></aside><main class="admin-main"><header th:replace="~{fragments/admin :: topbar('Quản lý danh mục')}"></header><div th:replace="~{fragments/admin :: flash}"></div><div class="admin-content"><div class="admin-panel"><div class="panel-head"><div><h2>Danh mục bộ sưu tập</h2><p>Phân loại sản phẩm hiển thị ngoài website</p></div><a th:href="@{/admin/categories/create}" class="btn btn-warning"><i class="fa fa-plus"></i> Thêm danh mục</a></div><div class="table-responsive"><table class="table admin-table"><thead><tr><th>ID</th><th>Tên danh mục</th><th>Đường dẫn</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="c : ${categories}"><td th:text="${c.id}"></td><td><b th:text="${c.name}"></b></td><td><code th:text="${c.slug}"></code></td><td th:text="${c.description}"></td><td><span class="admin-status" th:classappend="${c.active} ? 's-completed' : 's-cancelled'" th:text="${c.active ? 'Hiển thị' : 'Đang ẩn'}"></span></td><td><div class="actions"><a th:href="@{/admin/categories/edit/{id}(id=${c.id})}" class="icon-btn edit"><i class="fa fa-pencil"></i></a><form th:action="@{/admin/categories/delete/{id}(id=${c.id})}" method="post"><button class="icon-btn delete" type="submit" data-confirm="Xóa hoặc ẩn danh mục này?"><i class="fa fa-trash"></i></button></form></div></td></tr></tbody></table></div></div></div></main><th:block th:replace="~{fragments/admin :: scripts}"></th:block></body></html>
