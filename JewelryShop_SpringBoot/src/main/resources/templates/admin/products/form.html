<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/admin :: head(${editId == null ? 'Thêm trang sức' : 'Sửa trang sức'})}"></head><body><aside th:replace="~{fragments/admin :: sidebar('products')}"></aside><main class="admin-main"><header th:replace="~{fragments/admin :: topbar(${editId == null ? 'Thêm trang sức' : 'Cập nhật sản phẩm'})}"></header><div class="admin-content"><form th:action="${editId == null ? '/admin/products/create' : '/admin/products/edit/' + editId}" th:object="${productForm}" method="post" class="admin-panel form-panel"><div class="panel-head"><div><h2>Thông tin sản phẩm</h2><p>Điền đầy đủ các trường bên dưới</p></div><a th:href="@{/admin/products}" class="btn btn-outline-secondary">Quay lại</a></div><div class="row"><div class="col-md-8"><div class="form-group"><label>Tên sản phẩm *</label><input class="form-control" th:field="*{name}"><small class="text-danger" th:errors="*{name}"></small></div><div class="form-group"><label>Mô tả *</label><textarea class="form-control" rows="5" th:field="*{description}"></textarea><small class="text-danger" th:errors="*{description}"></small></div><div class="form-group"><label>Đường dẫn ảnh *</label><input class="form-control" th:field="*{image}" placeholder="/images/jewelry/halo-ring.svg"><small>Dùng ảnh trong thư mục /images/jewelry/</small><small class="text-danger d-block" th:errors="*{image}"></small></div></div><div class="col-md-4"><div class="form-group"><label>Danh mục *</label><select class="form-control" th:field="*{categoryId}"><option value="">-- Chọn danh mục --</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><small class="text-danger" th:errors="*{categoryId}"></small></div><div class="form-group"><label>Giá gốc *</label><input class="form-control" type="number" step="1000" th:field="*{price}"><small class="text-danger" th:errors="*{price}"></small></div><div class="form-group"><label>Giảm giá (%)</label><input class="form-control" type="number" min="0" max="90" th:field="*{discountPercent}" placeholder="0"><small>Nhập từ 0 đến 90; nhập 0 nếu không giảm</small><small class="text-danger d-block" th:errors="*{discountPercent}"></small></div><div class="form-group"><label>Tồn kho</label><input class="form-control" type="number" th:field="*{stock}"><small class="text-danger" th:errors="*{stock}"></small></div><input type="hidden" th:field="*{preparationMinutes}" value="1"><div class="custom-control custom-switch mb-3"><input class="custom-control-input" type="checkbox" th:field="*{available}" id="available"><label class="custom-control-label" for="available">Đang bán</label></div><div class="custom-control custom-switch"><input class="custom-control-input" type="checkbox" th:field="*{featured}" id="featured"><label class="custom-control-label" for="featured">Sản phẩm nổi bật</label></div></div></div><div class="form-actions"><button class="btn btn-warning btn-lg" type="submit"><i class="fa fa-save"></i> Lưu sản phẩm</button></div></form></div></main><th:block th:replace="~{fragments/admin :: scripts}"></th:block></body></html>
