<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/admin :: head('Quản lý sản phẩm')}"></head><body><aside th:replace="~{fragments/admin :: sidebar('products')}"></aside><main class="admin-main"><header th:replace="~{fragments/admin :: topbar('Quản lý sản phẩm')}"></header><div th:replace="~{fragments/admin :: flash}"></div><div class="admin-content"><div class="admin-panel"><div class="panel-head"><div><h2>Danh sách sản phẩm</h2><p>Thêm, sửa, xóa, cập nhật giá và khuyến mãi</p></div><a th:href="@{/admin/products/create}" class="btn btn-warning"><i class="fa fa-plus"></i> Thêm trang sức</a></div><div class="table-responsive"><table class="table admin-table"><thead><tr><th>ID</th><th>Sản phẩm</th><th>Danh mục</th><th>Giá bán</th><th>Giảm</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="product : ${products}"><td th:text="${product.id}"></td><td><div class="product-cell"><img th:src="${product.image}"><div><b th:text="${product.name}"></b><small th:if="${product.featured}"><i class="fa fa-star"></i> Nổi bật</small></div></div></td><td th:text="${product.category.name}"></td><td><small th:if="${product.discounted}" class="original-price d-block" th:text="${#numbers.formatDecimal(product.price,0,'COMMA',0,'POINT')} + ' ₫'"></small><b th:text="${#numbers.formatDecimal(product.finalPrice,0,'COMMA',0,'POINT')} + ' ₫'"></b></td><td><span th:if="${product.discounted}" class="badge badge-danger" th:text="'-' + ${product.discountPercent} + '%'"></span><span th:unless="${product.discounted}">—</span></td><td th:text="${product.stock}"></td><td><span class="admin-status" th:classappend="${product.available} ? 's-completed' : 's-cancelled'" th:text="${product.available ? 'Đang bán' : 'Ngừng bán'}"></span></td><td><div class="actions"><a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="icon-btn edit"><i class="fa fa-pencil"></i></a><form th:action="@{/admin/products/{id}/toggle(id=${product.id})}" method="post"><button class="icon-btn" type="submit"><i class="fa fa-power-off"></i></button></form><form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post"><button class="icon-btn delete" type="submit" data-confirm="Xóa sản phẩm này?"><i class="fa fa-trash"></i></button></form></div></td></tr></tbody></table></div></div></div></main><th:block th:replace="~{fragments/admin :: scripts}"></th:block></body></html>
