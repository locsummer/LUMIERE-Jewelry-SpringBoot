<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/admin :: head('Tổng quan')}"></head><body><aside th:replace="~{fragments/admin :: sidebar('dashboard')}"></aside><main class="admin-main"><header th:replace="~{fragments/admin :: topbar('Tổng quan hệ thống')}"></header><div th:replace="~{fragments/admin :: flash}"></div><div class="admin-content">
    <div class="stats-grid"><div class="stat-card orange"><i class="fa fa-shopping-bag"></i><div><span>Tổng đơn hàng</span><strong th:text="${orderCount}"></strong><small th:text="${pendingCount} + ' đơn chờ xử lý'"></small></div></div><div class="stat-card green"><i class="fa fa-money"></i><div><span>Doanh thu hoàn thành</span><strong th:text="${#numbers.formatDecimal(revenue,0,'COMMA',0,'POINT')} + ' ₫'"></strong><small>Từ đơn đã hoàn thành</small></div></div><div class="stat-card blue"><i class="fa fa-cutlery"></i><div><span>Sản phẩm</span><strong th:text="${productCount}"></strong><small th:text="${categoryCount} + ' danh mục'"></small></div></div><div class="stat-card purple"><i class="fa fa-users"></i><div><span>Tài khoản</span><strong th:text="${customerCount + staffCount + adminCount}"></strong><small th:text="${customerCount + ' khách · ' + staffCount + ' nhân viên'}"></small></div></div></div>
    <div class="admin-panel"><div class="panel-head"><div><h2>Đơn hàng gần đây</h2><p>Theo dõi nhanh hoạt động đặt sản phẩm</p></div><a th:href="@{/admin/orders}" class="btn btn-warning">Xem tất cả</a></div><div class="table-responsive"><table class="table admin-table"><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Thời gian</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="order : ${recentOrders}"><td><b th:text="${order.orderCode}"></b></td><td><span th:text="${order.customerName}"></span><small th:text="${order.customerPhone}"></small></td><td th:text="${#temporals.format(order.createdAt,'dd/MM HH:mm')}"></td><td th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT')} + ' ₫'"></td><td><span class="admin-status" th:classappend="'s-' + ${#strings.toLowerCase(order.status.name())}" th:text="${order.status.label}"></span></td><td><a th:href="@{/admin/orders/{id}(id=${order.id})}" class="icon-btn"><i class="fa fa-eye"></i></a></td></tr><tr th:if="${#lists.isEmpty(recentOrders)}"><td colspan="6" class="text-center">Chưa có đơn hàng</td></tr></tbody></table></div></div>
</div></main><th:block th:replace="~{fragments/admin :: scripts}"></th:block></body></html>
