<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/client :: head('Đặt hàng thành công')}"></head><body><header th:replace="~{fragments/client :: header('')}"></header><div th:replace="~{fragments/client :: flash}"></div><main class="success-page"><div class="success-card"><div class="success-check"><i class="fa fa-check"></i></div><h1>Đặt sản phẩm thành công!</h1><p>Đơn hàng của bạn đã được ghi nhận.</p><div class="success-code"><small>Mã đơn hàng</small><strong th:text="${order.orderCode}"></strong></div><div class="success-summary"><span>Tổng thanh toán</span><b th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT')} + ' ₫'"></b><span>Phương thức</span><b th:text="${order.paymentMethod.label}"></b><span>Trạng thái</span><b th:text="${order.status.label}"></b></div><div class="d-flex"><a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-warning flex-fill mr-2">Xem chi tiết</a><a th:href="@{/products}" class="btn btn-outline-dark flex-fill">Tiếp tục đặt sản phẩm</a></div></div></main><th:block th:replace="~{fragments/client :: scripts}"></th:block></body></html>
