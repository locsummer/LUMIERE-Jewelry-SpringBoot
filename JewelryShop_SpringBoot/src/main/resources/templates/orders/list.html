<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/client :: head('Đơn hàng của tôi')}"></head><body><header th:replace="~{fragments/client :: header('orders')}"></header><div th:replace="~{fragments/client :: flash}"></div><main class="container layout_padding"><div class="page-heading"><div><h1>Đơn hàng của tôi</h1><p>Theo dõi các đơn bạn đã đặt</p></div><a th:href="@{/products}" class="btn btn-warning">Đặt thêm sản phẩm</a></div><div th:if="${#lists.isEmpty(orders)}" class="empty-state"><i class="fa fa-file-text-o"></i><h3>Bạn chưa có đơn hàng</h3><a th:href="@{/products}" class="btn btn-warning">Đặt sản phẩm đầu tiên</a></div><div class="order-list"><a th:each="order : ${orders}" th:href="@{/orders/{id}(id=${order.id})}" class="order-card"><div><strong th:if="${order.paymentMethod.name() != 'BANK_TRANSFER' || order.paymentStatus.name() == 'PAID'}" th:text="'#' + ${order.orderCode}"></strong><strong th:if="${order.paymentMethod.name() == 'BANK_TRANSFER' && order.paymentStatus.name() != 'PAID'}" class="text-warning">Chưa thanh toán</strong><small th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}"></small></div><div class="order-items-preview"><span th:text="${order.items.size()} + ' sản phẩm'"></span><span th:text="${order.paymentMethod.label}"></span><span class="payment-list-status" th:text="${order.paymentStatus.label}"></span></div><div><span class="status-badge" th:classappend="'status-' + ${#strings.toLowerCase(order.status.name())}" th:text="${order.status.label}"></span><strong th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT')} + ' ₫'"></strong></div><i class="fa fa-angle-right"></i></a></div></main><footer th:replace="~{fragments/client :: footer}"></footer><th:block th:replace="~{fragments/client :: scripts}"></th:block></body></html>
