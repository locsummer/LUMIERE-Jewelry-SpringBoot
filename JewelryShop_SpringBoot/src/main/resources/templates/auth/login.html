<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/client :: head('Đăng nhập')}"></head><body class="auth-page"><header th:replace="~{fragments/client :: header('')}"></header><div th:replace="~{fragments/client :: flash}"></div>
<main class="auth-section"><div class="auth-card"><div class="auth-icon"><i class="fa fa-user"></i></div><h1>Đăng nhập</h1><p>Chào mừng bạn quay lại LUMIÈRE Jewelry</p>
    <div th:if="${param.error}" class="alert alert-danger">Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.</div><div th:if="${param.logout}" class="alert alert-success">Bạn đã đăng xuất thành công.</div>
    <form th:action="@{/login}" method="post"><div class="form-group"><label>Email</label><div class="input-icon"><i class="fa fa-envelope"></i><input class="form-control" type="email" name="email" placeholder="user@product.vn" required autofocus></div></div><div class="form-group"><label>Mật khẩu</label><div class="input-icon"><i class="fa fa-lock"></i><input class="form-control" type="password" name="password" placeholder="••••••••" required></div></div><button class="btn btn-warning btn-block btn-lg" type="submit">Đăng nhập</button></form>
    <div class="demo-accounts"><strong>Tài khoản dùng thử</strong><small>Khách: user@product.vn / user123</small><small>Nhân viên: staff@product.vn / staff123</small><small>Admin: admin@product.vn / admin123</small></div><p class="auth-link">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
</div></main><th:block th:replace="~{fragments/client :: scripts}"></th:block></body></html>
