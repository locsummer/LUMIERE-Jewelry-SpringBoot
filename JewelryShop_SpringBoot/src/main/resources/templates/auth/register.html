<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/client :: head('Đăng ký')}"></head><body class="auth-page"><header th:replace="~{fragments/client :: header('')}"></header>
<main class="auth-section"><div class="auth-card wide"><div class="auth-icon"><i class="fa fa-user-plus"></i></div><h1>Tạo tài khoản</h1><p>Đăng ký để đặt sản phẩm và theo dõi đơn hàng</p>
    <form th:action="@{/register}" th:object="${registerForm}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><div class="row"><div class="col-md-6"><div class="form-group"><label>Họ và tên *</label><input class="form-control" th:field="*{fullName}" placeholder="Nguyễn Văn A"><small class="text-danger" th:errors="*{fullName}"></small></div></div><div class="col-md-6"><div class="form-group"><label>Số điện thoại</label><input class="form-control" th:field="*{phone}" placeholder="0901234567"><small class="text-danger" th:errors="*{phone}"></small></div></div></div>
        <div class="form-group"><label>Email *</label><input class="form-control" type="email" th:field="*{email}" placeholder="email@example.com"><small class="text-danger" th:errors="*{email}"></small></div><div class="row"><div class="col-md-6"><div class="form-group"><label>Mật khẩu *</label><input class="form-control" type="password" th:field="*{password}"><small class="text-danger" th:errors="*{password}"></small></div></div><div class="col-md-6"><div class="form-group"><label>Xác nhận mật khẩu *</label><input class="form-control" type="password" th:field="*{confirmPassword}"><small class="text-danger" th:errors="*{confirmPassword}"></small></div></div></div><button class="btn btn-warning btn-block btn-lg" type="submit">Đăng ký</button></form><p class="auth-link">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
</div></main><th:block th:replace="~{fragments/client :: scripts}"></th:block></body></html>
