<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/client :: head('VNPay Demo')}"></head><body><header th:replace="~{fragments/client :: header('')}"></header><main class="payment-page vnpay"><div class="payment-card"><div class="vnpay-logo">VN<span>PAY</span></div><h1>Cổng thanh toán demo</h1><p th:text="'Thanh toán cho đơn ' + ${order.orderCode}"></p><div class="pay-amount"><small>Số tiền</small><strong th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT')} + ' ₫'"></strong></div><div class="alert alert-warning">Chế độ demo chạy được ngay, không yêu cầu VNPAY_TMN_CODE hoặc VNPAY_HASH_SECRET và không trừ tiền thật.</div><form th:action="@{/payment/vnpay/{code}/pay(code=${order.orderCode})}" method="post"><button class="btn btn-danger btn-block btn-lg" type="submit">Thanh toán thành công (demo)</button></form><a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-link btn-block">Thanh toán sau</a></div></main><th:block th:replace="~{fragments/client :: scripts}"></th:block></body></html>
