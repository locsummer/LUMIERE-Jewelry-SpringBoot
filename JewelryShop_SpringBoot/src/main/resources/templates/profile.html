<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/client :: head('Hồ sơ')}"></head><body><header th:replace="~{fragments/client :: header('')}"></header><div th:replace="~{fragments/client :: flash}"></div><main class="container layout_padding"><div class="row justify-content-center"><div class="col-lg-8"><div class="profile-card"><div class="profile-head"><div class="avatar"><i class="fa fa-user"></i></div><div><h1 th:text="${user.fullName}"></h1><p th:text="${user.email}"></p><span th:text="${user.role.label}"></span></div></div><form th:action="@{/profile}" th:object="${profileForm}" method="post"><div class="form-group"><label>Họ và tên</label><input class="form-control" th:field="*{fullName}"><small class="text-danger" th:errors="*{fullName}"></small></div><div class="form-group"><label>Số điện thoại</label><input class="form-control" th:field="*{phone}"><small class="text-danger" th:errors="*{phone}"></small></div><div class="form-group"><label>Địa chỉ mặc định</label><textarea class="form-control" rows="3" th:field="*{address}"></textarea></div><button class="btn btn-warning" type="submit">Lưu thay đổi</button><a class="btn btn-outline-dark ml-2" th:href="@{/orders}">Xem đơn hàng</a></form></div></div></div></main><footer th:replace="~{fragments/client :: footer}"></footer><th:block th:replace="~{fragments/client :: scripts}"></th:block></body></html>
