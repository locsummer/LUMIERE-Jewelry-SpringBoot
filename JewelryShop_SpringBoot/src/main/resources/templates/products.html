<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/client :: head('Bộ sưu tập')}"></head><body>
<header th:replace="~{fragments/client :: header('products')}"></header><div th:replace="~{fragments/client :: flash}"></div>
<section class="product_section layout_padding"><div class="container">
    <div class="heading_container heading_center"><h2>Bộ sưu tập hôm nay</h2><p>Tìm kiếm và chọn sản phẩm bạn yêu thích</p></div>
    <form class="products-search" th:action="@{/products}" method="get"><div class="input-group"><input class="form-control" type="search" name="q" th:value="${keyword}" placeholder="Tìm nhẫn, dây chuyền, bông tai..."><div class="input-group-append"><button class="btn btn-warning" type="submit"><i class="fa fa-search"></i> Tìm kiếm</button></div></div></form>
    <ul class="filters_menu"><li th:classappend="${selectedCategory == null} ? 'active'"><a th:href="@{/products(q=${keyword})}">Tất cả</a></li><li th:each="category : ${categories}" th:classappend="${selectedCategory == category.slug} ? 'active'"><a th:href="@{/products(category=${category.slug},q=${keyword})}" th:text="${category.name}">Danh mục</a></li></ul>
    <div th:if="${#lists.isEmpty(products)}" class="empty-state"><i class="fa fa-search"></i><h3>Không tìm thấy sản phẩm phù hợp</h3><p>Thử từ khóa hoặc danh mục khác nhé.</p></div>
    <div class="filters-content"><div class="row grid"><div th:each="product : ${products}" class="col-sm-6 col-lg-4 all"><div class="box product-card"><div><div class="img-box"><span th:if="${product.discounted}" class="discount-badge" th:text="'-' + ${product.discountPercent} + '%'"></span><img th:src="${product.image}" th:alt="${product.name}"></div><div class="detail-box">
        <div class="d-flex justify-content-between align-items-start"><a class="product-title" th:href="@{/product/{slug}(slug=${product.slug})}" th:text="${product.name}"></a><span class="prep"><i class="fa fa-certificate"></i> Chính hãng</span></div>
        <p th:text="${#strings.abbreviate(product.description, 110)}"></p><div class="options"><div class="price-block"><span th:if="${product.discounted}" class="original-price" th:text="${#numbers.formatDecimal(product.price,0,'COMMA',0,'POINT')} + ' ₫'"></span><h6 th:text="${#numbers.formatDecimal(product.finalPrice,0,'COMMA',0,'POINT')} + ' ₫'"></h6><small th:if="${product.discounted}" th:text="'Tiết kiệm ' + ${#numbers.formatDecimal(product.savingAmount,0,'COMMA',0,'POINT')} + ' ₫'"></small></div><form th:action="@{/cart/add}" method="post"><input type="hidden" name="productId" th:value="${product.id}"><button class="round-cart" type="submit"><i class="fa fa-shopping-cart"></i></button></form></div>
    </div></div></div></div></div></div>
</div></section><footer th:replace="~{fragments/client :: footer}"></footer><th:block th:replace="~{fragments/client :: scripts}"></th:block></body></html>
