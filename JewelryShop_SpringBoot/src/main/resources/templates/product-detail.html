<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/client :: head(${product.name})}"></head><body>
<header th:replace="~{fragments/client :: header('products')}"></header><div th:replace="~{fragments/client :: flash}"></div>
<main class="container layout_padding"><div class="row product-detail-page"><div class="col-lg-6"><div class="detail-image"><span th:if="${product.discounted}" class="discount-badge detail-badge" th:text="'GIẢM ' + ${product.discountPercent} + '%'"></span><img th:src="${product.image}" th:alt="${product.name}"></div></div><div class="col-lg-6"><span class="category-pill" th:text="${product.category.name}"></span><h1 th:text="${product.name}"></h1><div class="detail-pricing"><span th:if="${product.discounted}" class="original-price" th:text="'Giá gốc: ' + ${#numbers.formatDecimal(product.price,0,'COMMA',0,'POINT')} + ' ₫'"></span><div class="detail-price" th:text="${#numbers.formatDecimal(product.finalPrice,0,'COMMA',0,'POINT')} + ' ₫'"></div><span th:if="${product.discounted}" class="saving-label" th:text="'Giảm ' + ${product.discountPercent} + '% • Tiết kiệm ' + ${#numbers.formatDecimal(product.savingAmount,0,'COMMA',0,'POINT')} + ' ₫'"></span></div><p th:text="${product.description}"></p><div class="product-meta"><span><i class="fa fa-shield"></i> Bảo hành chính hãng</span><span><i class="fa fa-check-circle"></i> Còn <b th:text="${product.stock}"></b> sản phẩm</span></div>
    <form th:action="@{/cart/add}" method="post" class="add-detail-form"><input type="hidden" name="productId" th:value="${product.id}"><label>Số lượng</label><input class="form-control" type="number" name="quantity" value="1" min="1" th:max="${product.stock}"><button class="btn btn-warning btn-lg" type="submit"><i class="fa fa-shopping-cart"></i> Thêm vào giỏ</button></form>
</div></div>
<section class="related"><h3>Có thể bạn cũng thích</h3><div class="row"><div th:each="item : ${relatedProducts}" class="col-6 col-md-3"><a class="related-card" th:href="@{/product/{slug}(slug=${item.slug})}"><img th:src="${item.image}" th:alt="${item.name}"><strong th:text="${item.name}"></strong><small th:if="${item.discounted}" class="original-price" th:text="${#numbers.formatDecimal(item.price,0,'COMMA',0,'POINT')} + ' ₫'"></small><span th:text="${#numbers.formatDecimal(item.finalPrice,0,'COMMA',0,'POINT')} + ' ₫'"></span></a></div></div></section>
</main><footer th:replace="~{fragments/client :: footer}"></footer><th:block th:replace="~{fragments/client :: scripts}"></th:block></body></html>
